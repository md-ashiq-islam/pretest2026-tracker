<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>প্রি-টেস্ট প্রোডাক্টিভিটি ট্র্যাকার</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#050d1a;--card:rgba(15,28,48,.72);--card2:rgba(30,50,80,.55);--line:rgba(90,150,210,.22);--tx:#e8f1fb;--mut:#8aa0b8;--ac:#38bdf8;--ac2:#6366f1;--ok:#34d399;--grad:linear-gradient(90deg,#38bdf8,#6366f1,#a78bfa);--b1:#0ea5e9;--b2:#6366f1;--b3:#14b8a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#edf3fb;--card:rgba(255,255,255,.8);--card2:rgba(225,236,249,.8);--line:rgba(60,110,170,.22);--tx:#0f2236;--mut:#546a82;--ac:#0369a1;--ac2:#4f46e5;--ok:#047857}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Anek Bangla','Hind Siliguri',system-ui,sans-serif;padding:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;pointer-events:none}
body::before{background:radial-gradient(circle,var(--b1),transparent 65%);top:-25vmax;left:-20vmax;animation:drift 18s infinite alternate ease-in-out}
body::after{background:radial-gradient(circle,var(--b2),transparent 65%);bottom:-25vmax;right:-20vmax;animation:drift 22s infinite alternate-reverse ease-in-out}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2)}}
.wrap{max-width:820px;margin:0 auto}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0}
.float{animation:flt 3s infinite ease-in-out}.pulse{animation:pls 2s infinite ease-in-out}.sway{animation:swy 2.6s infinite ease-in-out}.flip{animation:flp 4s infinite ease-in-out}.spin{animation:spn 14s infinite linear}
@keyframes flt{50%{transform:translateY(-3px)}}@keyframes pls{50%{transform:scale(1.18)}}@keyframes swy{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes flp{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}@keyframes spn{to{transform:rotate(360deg)}}
.in{opacity:0;transform:translateY(18px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{to{opacity:1;transform:none}}
.box{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:12px;background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(99,102,241,.14)),var(--card)}
.hero h1{font-size:1.55rem;margin:0 0 4px;line-height:1.2;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s infinite linear}
@keyframes shine{to{background-position:200% 0}}
.hero p{margin:0;color:var(--mut)}
.ring{position:relative;width:112px;height:112px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}.ring .tr{stroke:var(--card2)}
.ring .pg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(56,189,248,.7))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem}
@media(max-width:520px){.hero{flex-direction:column;text-align:center}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.lbl{color:var(--mut);font-size:.88rem;margin-bottom:6px;display:flex;align-items:center;gap:7px}.lbl .ic{color:var(--ac)}
.big{font-size:1.55rem;font-weight:700;color:var(--ac)}
.cd{display:flex;gap:10px}.cd div{flex:1;text-align:center;background:var(--card2);border-radius:12px;padding:8px 2px}.cd b{display:block;font-size:1.4rem;color:var(--ac);font-variant-numeric:tabular-nums}.cd small{color:var(--mut)}
.cd b.tk{animation:tk .35s}@keyframes tk{from{transform:translateY(-6px);opacity:.3}}
.plan{position:relative;border:1px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(120deg,#38bdf8,#6366f1,#14b8a6,#38bdf8) border-box;background-size:100% 100%,300% 300%;animation:bd 6s infinite linear;margin-bottom:12px}
@keyframes bd{to{background-position:0 0,300% 0}}
.plan>.in2{position:relative}
.plan p{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}.stats div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center}.stats b{display:block;font-size:1.5rem;color:var(--ac);line-height:1.2}.stats small{color:var(--mut);font-size:.78rem}@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.nm{font-size:1.02rem;font-weight:700;letter-spacing:.3px;color:var(--ac);white-space:nowrap}.grid>.box{display:flex;flex-direction:column;justify-content:center}#clk{font-size:2.1rem;line-height:1.2}.cr{font-size:.82rem;display:flex;gap:6px;justify-content:center;align-items:center}
.dg{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:8px}.dg span{color:var(--mut);font-size:.9rem}.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}.dr{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}.dr span{color:var(--mut);font-size:.8rem}.dr b{color:var(--ac);font-size:1.2rem}.dr small{color:var(--mut);font-size:.75rem}.dr.now{outline:1px solid var(--ac)}
.brand{display:flex;justify-content:center;margin:2px 0 14px}.plate{background:linear-gradient(135deg,#f6fbff,#e1effb);border-radius:16px;padding:9px 16px;box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.7)}.plate img{display:block;width:clamp(88px,26vw,116px);height:auto}.plate.sm{padding:6px 11px;border-radius:12px;opacity:.92}.plate.sm img{width:clamp(56px,17vw,72px)}
.plan .stats,.plan .stats+p{display:none}.plan{padding:12px 16px;margin-bottom:6px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:8px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.row{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}.row span{display:flex;gap:7px;align-items:center}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i,.sb i{display:block;height:100%;width:0;background:var(--grad);background-size:200% 100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1);animation:shine 3s infinite linear;position:relative}
.bar i::after,.sb i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45),transparent 70%);background-size:200% 100%;animation:sweep 2.2s infinite}
@keyframes sweep{from{background-position:200% 0}to{background-position:-100% 0}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sr{position:relative;flex:1 1 180px}.sr .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 12px 10px 38px;font:inherit}
button{font:inherit;display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(56,189,248,.2)}button:active{transform:scale(.95)}
button.on,button.pri{background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:transparent;color:#fff}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
details{margin-bottom:12px;padding:0;transition:border-color .3s,transform .25s}details:hover{border-color:var(--ac);transform:translateY(-2px)}
summary{cursor:pointer;padding:14px;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.08rem}
summary::-webkit-details-marker{display:none}
summary .si{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(99,102,241,.25));color:var(--ac)}
summary .pc{margin-left:auto;color:var(--ac);font-size:.9rem;display:flex;gap:6px;align-items:center;white-space:nowrap}
summary .ch{color:var(--mut);transition:transform .25s}details[open] summary .ch{transform:rotate(90deg)}
.sb{height:6px;margin:0 14px 8px;background:var(--card2);border-radius:9px;overflow:hidden}
.body{padding:0 14px 14px;animation:up .4s both}
.gh{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;color:var(--ac);font-weight:600;font-size:.95rem}
.gh button{font-size:.8rem;padding:3px 10px}
label.t{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:6px 0;background:var(--card2);border-radius:11px;cursor:pointer;transition:transform .2s,background .2s}
label.t:hover{transform:translateX(4px)}
label.t input{position:absolute;opacity:0;pointer-events:none}
.bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--ac);display:grid;place-items:center;flex-shrink:0;transition:all .25s}
.bx svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
label.t input:checked+.bx{background:linear-gradient(135deg,#34d399,#14b8a6);border-color:transparent;animation:pop .35s}
label.t input:checked+.bx svg{stroke-dashoffset:0}
label.t input:focus-visible+.bx{outline:2px solid var(--ac);outline-offset:2px}
@keyframes pop{50%{transform:scale(1.3)}}
label.t:has(input:checked) span{text-decoration:line-through;color:var(--mut)}
.hide{display:none!important}.empty{text-align:center;color:var(--mut);padding:20px}
footer{text-align:center;color:var(--mut);margin:24px 0 10px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.in{opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg>
<div class="wrap">
<div class="brand in"><div class="plate"><img id="lg1" alt="Pre-Test Progress লোগো"></div></div>
<div class="box hero in" style="--i:0">
  <div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="rp" cx="60" cy="60" r="52"/></svg><b id="rt">০%</b></div>
  <div><h1 id="h1"></h1><p>টার্গেট ডেডলাইন: ১ নভেম্বর, ২০২৬</p></div>
</div>

<div class="box in" id="daily" style="--i:1;margin-bottom:12px"></div>
<div class="grid">
  <div class="box in" style="--i:1"><div class="lbl" id="l1"></div><div class="big" id="clk">--</div><div class="lbl" id="dt" style="margin:4px 0 0"></div></div>
  <div class="box in" style="--i:2"><div class="lbl" id="l2"></div>
    <div class="cd"><div><b id="d">০০</b><small>দিন</small></div><div><b id="h">০০</b><small>ঘণ্টা</small></div><div><b id="m">০০</b><small>মিনিট</small></div><div><b id="s">০০</b><small>সেকেন্ড</small></div></div></div>
</div>

<div class="box plan in" style="--i:3" id="plan"></div>

<div class="sticky">

</div>

<div class="tools">

  <button data-f="all" class="on">সব</button><button data-f="todo">বাকি</button><button data-f="done">সম্পন্ন</button>
  <button id="exp">সব খুলুন</button><button id="col">সব বন্ধ</button>
</div>

<div id="list"></div>
<div class="empty hide" id="none">কোনো টপিক মেলেনি। অন্য শব্দ দিয়ে খুঁজুন।</div>
<div class="tools" style="justify-content:center"><button id="rst"></button></div>
<footer><div class="brand" style="margin:0 0 12px"><div class="plate sm"><img id="lg2" alt="Pre-Test Progress লোগো"></div></div><div class="cr" style="display:block;text-align:center">© 2026 Pre-test Tracker. All rights reserved.</div><div class="cr" style="display:block;text-align:center;margin-top:4px">Architected, Designed, and Maintained with precision by <span class="nm">Ashiqul Islam</span>.</div><button id="up" type="button" style="margin:14px auto 0"><svg class="ic float" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg> সামনের দিকে যান</button></footer>
</div>

<script>
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const nums=(p,a)=>a.map(n=>p+' '+bn(n));
const rng=(p,n)=>nums(p,Array.from({length:n},(_,i)=>i+1));
const P={
cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
glass:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',
chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
coins:'<circle cx="9" cy="9" r="6"/><path d="M15 9.5A6 6 0 1 1 9.5 15"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3a9 9 0 0 1 6 6h-6z"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 21h8M10 17h4"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
chev:'<path d="m9 6 6 6-6 6"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
ok:'<path d="m5 12 5 5 9-10"/>'};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const DATA=[
{id:'bn',name:'বাংলা',ic:'book',a:'sway',g:[
 ['গদ্য',['নেকলেস','জীবন বৃক্ষ','গন্তব্য কেবল','রেইনকোট']],
 ['পদ্য',['ফেব্রুয়ারি ১৯৬৯','১৮ বছর বয়স','আমি কিংবদন্তের কথা বলছি','প্রত্যাবর্তননের লজ্জা']],
 ['সহপাঠ',['লালসালু (উপন্যাস) অথবা সিরাজউদ্দৌলা (নাটক)']],
 ['ব্যাকরণ',['বাক্যতত্ত্ব','বাংলা ভাষার অপপ্রয়োগ ও শুদ্ধ প্রয়োগ']],
 ['নির্মিতি',['সারাংশ','সংলাপ','প্রতিবেদন','ভাষণ']]]},
{id:'en',name:'ইংরেজি',ic:'globe',a:'spin',g:[
 ['কবিতা (Unit 11 & 12)',rng('কবিতা',7)],
 ['প্যাসেজ (Unit 10, 11, 12)',rng('প্যাসেজ',15)],
 ['কম্পোজিশন বই',nums('কম্পোজিশন নং',[1,2,8,44,51,61,79])],
 ['রিপোর্ট রাইটিং',nums('রিপোর্ট',[1,2,3,4,5,6,13,15,16,17])],
 ['গ্রাফ চার্ট',rng('গ্রাফ চার্ট',10)],
 ['স্টোরি রাইটিং',rng('স্টোরি',10)]]},
{id:'ict',name:'আইসিটি',ic:'laptop',a:'float',g:[['',['অধ্যায় ৩.১: সংখ্যাপদ্ধতি','অধ্যায় ৩.২: ডিজিটাল ডিভাইস','অধ্যায় ৪: ওয়েব ডিজাইন পরিচিতি ও HTML','অধ্যায় ৬: ডেটাবেজ ম্যানেজমেন্ট সিস্টেম']]]},
{id:'ac',name:'হিসাববিজ্ঞান',ic:'calc',a:'pulse',g:[['',['আর্থিক বিবরণী','দৃশ্যমান ও অদৃশ্যমান সম্পদের হিসাবরক্ষণ','ব্যাংক সমন্বয় বিবরণী','প্রাপ্য হিসাবসমূহের হিসাবরক্ষণ','উৎপাদন মজুরি ও বেতন বিবরণী','ব্যয় ও ব্যয় শ্রেণীবিভাগ','যৌথ মূলধনীয় কোম্পানির মূলধন']]]},
{id:'fn',name:'ফিন্যান্স, ব্যাংকিং ও বিমা',ic:'coins',a:'flip',g:[['',['দীর্ঘ মেয়াদী অর্থায়ন','মূলধন ব্যয়','ঝুঁকি ও মুনাফার হার','হস্তান্তরযোগ্য ঋণের দলিল','বৈদেশিক বিনিময় ও বৈদেশিক মুদ্রা','অগ্নিবীমা']]]},
{id:'mg',name:'ব্যবসায় সংগঠন ও ব্যবস্থাপনা',ic:'brief',a:'sway',g:[['খাতার লেখা ৭টি প্রশ্ন',rng('প্রশ্ন',7)]]},
{id:'ec',name:'অর্থনীতি',ic:'pie',a:'spin',g:[['',['মূলধন','সংগঠন','খাজনা','অর্থায়ন','মুদ্রাস্ফীতি']]]}
];
const KEY='ai_tracker_v4';
let st={done:{},open:{}};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const $=s=>document.querySelector(s),el=id=>document.getElementById(id);
let filter='all',query='';
$('#h1').innerHTML=I('cap','sway')+' প্রি-টেস্ট প্রোগ্রেস ট্র্যাকার';
$('#l1').innerHTML=I('clock','pulse')+' বর্তমান সময়';
$('#l2').innerHTML=I('glass','flip')+' ১ নভেম্বর পর্যন্ত বাকি';
$('#l3').innerHTML=I('chart','float')+' মোট সিলেবাস অগ্রগতি';
$('#si').innerHTML=I('search');
const RL=I('trash')+' সব রিসেট করুন';$('#rst').innerHTML=RL;

const items=[];
$('#list').innerHTML=DATA.map((s,k)=>{
  const gs=s.g.map((g,gi)=>{
    const rows=g[1].map((t,ti)=>{const id=s.id+gi+'_'+ti;items.push({id,sid:s.id,label:t});
      return `<label class="t" data-s="${t.toLowerCase()}"><input type="checkbox" id="${id}"><span class="bx"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span><span>${t}</span></label>`}).join('');
    return `<div class="grp">${g[0]?`<div class="gh"><span>${g[0]}</span><button data-all="${s.id}_${gi}">সব টিক</button></div>`:''}${rows}</div>`}).join('');
  return `<details class="box in" style="--i:${k+4}" data-sid="${s.id}"><summary><span class="si">${I(s.ic,s.a)}</span>${s.name}<span class="pc">০%</span><span class="ch">${I('chev')}</span></summary><div class="sb"><i></i></div><div class="body">${gs}</div></details>`}).join('');

function applyState(){items.forEach(i=>{el(i.id).checked=!!st.done[i.id]});
  document.querySelectorAll('details').forEach(d=>d.open=!!st.open[d.dataset.sid])}

function update(){
  let sum=0,left=0,rem=[];
  DATA.forEach(s=>{
    const its=items.filter(i=>i.sid===s.id),dn=its.filter(i=>st.done[i.id]).length,p=Math.round(dn/its.length*100);
    const d=document.querySelector(`details[data-sid="${s.id}"]`);
    d.querySelector('.pc').innerHTML=(p===100?I('trophy','pulse'):'')+bn(dn)+'/'+bn(its.length)+' · '+bn(p)+'%';
    d.querySelector('.sb i').style.width=p+'%';
    sum+=p;left+=its.length-dn;
    if(dn<its.length)rem.push({s,p,next:its.find(i=>!st.done[i.id])});
  });
  const gp=Math.round(sum/DATA.length);
  $('#gf').style.width=gp+'%';$('#gp').textContent=bn(gp)+'%';
  $('#rt').textContent=bn(gp)+'%';$('#rp').style.strokeDashoffset=326.7*(1-gp/100);
  const days=Math.max(1,Math.ceil((TARGET-Date.now())/864e5)),t=today();
  const doneToday=Object.values(st.done).filter(v=>v===t).length;
  daily(left,doneToday,days);const pl=$('#plan');
  if(!left){pl.innerHTML=`<div class="big">${I('spark','pulse')} সব সম্পন্ন!</div><p>পুরো সিলেবাস শেষ। এবার রিভিশন দিন।</p>`;}
  else{
    const per=Math.ceil((left+doneToday)/days),behind=Date.now()>TARGET;
    rem.sort((a,b)=>a.p-b.p);const n=rem[0];
    pl.innerHTML=`<div class="lbl">${I('bulb','pulse')} স্মার্ট পরিকল্পনা</div>
    <div class="stats"><div><b>${bn(left)}</b><small>টপিক বাকি</small></div><div><b>${behind?'০':bn(days)}</b><small>দিন বাকি</small></div><div><b>${behind?'—':bn(per)}</b><small>দৈনিক লক্ষ্য</small></div><div><b>${bn(doneToday)}</b><small>আজ সম্পন্ন</small></div></div>
    <p>${behind?'ডেডলাইন পেরিয়েছে, দ্রুত বাকি টপিকগুলো শেষ করুন।':`প্রতিদিন গড়ে <b>${bn(per)}</b>টি টপিক শেষ করলে ১ নভেম্বরের মধ্যে পুরো সিলেবাস শেষ হবে।`} ${doneToday>=per&&!behind?I('ok','pulse')+' আজকের লক্ষ্য পূর্ণ!':''}</p>
    <p>পরের সাজেশন: <b>${n.s.name}</b> — ${n.next.label}</p>
    <button class="pri" id="go" data-s="${n.s.id}" data-i="${n.next.id}" style="margin-top:8px">${I('target','pulse')} এখনই শুরু করুন</button>`;
  }
  save();
}

function daily(left,dn,days){
  const box=$('#daily'),R=left+dn,hd=`<div class="lbl">${I('target','pulse')} আজকের লক্ষ্য ও দৈনিক পরিকল্পনা</div>`;
  if(!left){box.innerHTML=hd+`<div class="big">${I('spark','pulse')} সব টপিক সম্পন্ন!</div>`;return}
  if(Date.now()>TARGET){box.innerHTML=hd+`<div class="big">ডেডলাইন পেরিয়েছে</div><p style="margin:4px 0 0">বাকি ${bn(left)}টি টপিক</p>`;return}
  const base=Math.floor(R/days),ex=R%days,t0=base+(ex>0?1:0),rest=Math.max(0,t0-dn);
  box.innerHTML=hd+`<div class="dg"><div class="big">${bn(t0)}টি টপিক</div><span>আজ ${bn(dn)}টি শেষ · আরও ${bn(rest)}টি বাকি</span></div><div class="bar"><i style="width:${t0?Math.min(100,dn/t0*100):100}%"></i></div>`;
}

function applyFilter(){
  const q=query.trim().toLowerCase();let any=false;
  items.forEach(i=>{const r=el(i.id).closest('label'),ok=(!q||r.dataset.s.includes(q))&&(filter==='all'||(filter==='done')===!!st.done[i.id]);r.classList.toggle('hide',!ok)});
  document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('hide',!g.querySelector('label:not(.hide)')));
  document.querySelectorAll('details').forEach(d=>{const has=!!d.querySelector('label:not(.hide)');d.classList.toggle('hide',!has);
    if(has)any=true;if(q&&has)d.open=true});
  $('#none').classList.toggle('hide',any);
}

$('#list').addEventListener('change',e=>{
  const c=e.target;if(c.type!=='checkbox')return;
  if(c.checked)st.done[c.id]=today();else delete st.done[c.id];
  update();if(filter!=='all')applyFilter();
});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-all]');if(!b)return;
  const [s,g]=b.dataset.all.split('_'),ids=items.filter(i=>i.id.startsWith(s+g+'_')).map(i=>i.id);
  const all=ids.every(i=>st.done[i]);
  ids.forEach(i=>{if(all)delete st.done[i];else if(!st.done[i])st.done[i]=today();el(i).checked=!all});
  update();if(filter!=='all')applyFilter();
});
$('#list').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sid&&!query){st.open[d.dataset.sid]=d.open;save()}},true);
$('#q').addEventListener('input',e=>{query=e.target.value;applyFilter()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));applyFilter()});
$('#exp').onclick=()=>document.querySelectorAll('details:not(.hide)').forEach(d=>d.open=true);
$('#col').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
let rt=null;
$('#rst').onclick=function(){
  const b=this;
  if(!rt){b.innerHTML=I('target','pulse')+' নিশ্চিত? আবার চাপুন';b.classList.add('pri');rt=setTimeout(()=>{rt=null;b.innerHTML=RL;b.classList.remove('pri')},4000);return}
  clearTimeout(rt);rt=null;st.done={};applyState();update();applyFilter();
  b.classList.remove('pri');b.innerHTML=I('ok','pulse')+' রিসেট হয়েছে';setTimeout(()=>b.innerHTML=RL,2000);
};
$('#plan').addEventListener('click',e=>{
  const b=e.target.closest('#go');if(!b)return;
  const d=document.querySelector(`details[data-sid="${b.dataset.s}"]`);d.classList.remove('hide');d.open=true;
  const t=el(b.dataset.i).closest('label');t.classList.remove('hide');t.scrollIntoView({behavior:'smooth',block:'center'});
  t.style.outline='2px solid var(--ac)';setTimeout(()=>t.style.outline='',1800);
});

const TARGET=new Date(2026,10,1).getTime();
const pv={};
function tick(){
  const n=new Date();let h=n.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
  $('#clk').textContent=bn(String(h).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0'))+' '+ap;
  $('#dt').textContent=n.toLocaleDateString('bn-BD',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const df=Math.max(0,TARGET-n.getTime());
  const v=[Math.floor(df/864e5),Math.floor(df%864e5/36e5),Math.floor(df%36e5/6e4),Math.floor(df%6e4/1e3)];
  ['d','h','m','s'].forEach((k,i)=>{const e=el(k),x=bn(String(v[i]).padStart(2,'0'));
    if(pv[k]!==x){e.textContent=x;e.classList.remove('tk');void e.offsetWidth;e.classList.add('tk');pv[k]=x}});
}
setInterval(tick,1000);tick();
